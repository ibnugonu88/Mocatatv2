<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Riwayat Transaksi - MoCatat</title>
    <meta name="theme-color" content="#249a95">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- PANGGIL FILE CSS SENTRAL -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <div id="loading-screen" class="loading-screen">Memuat Data...<div class="spinner"></div></div>

        <header class="header-simple"><a href="index.html" class="btn-back"><span class="material-icons-round">arrow_back_ios_new</span></a><span>Riwayat Transaksi</span></header>

        <div class="summary-card">
            <div class="summary-item" style="border-right: 1px solid #f1f5f9; padding-right: 10px;">
                <div class="summary-label"><span class="material-icons-round" style="font-size:14px; color:#2e7d32;">south_west</span> Total Masuk</div>
                <div class="summary-val val-in" id="summary-in">Rp 0</div>
            </div>
            <div class="summary-item" style="padding-left: 5px;">
                <div class="summary-label"><span class="material-icons-round" style="font-size:14px; color:#c62828;">north_east</span> Total Keluar</div>
                <div class="summary-val val-out" id="summary-out">Rp 0</div>
            </div>
        </div>

        <div class="list-wrapper">
            <div class="filter-container">
                <select id="filter-period" class="filter-input" onchange="window.renderHistoryPage()">
                    <option value="all">Semua Waktu</option>
                    <option value="today">Hari Ini</option>
                    <option value="week">Minggu Ini</option>
                    <option value="month" selected>Bulan Ini</option>
                </select>
                <select id="filter-type" class="filter-input" onchange="window.renderHistoryPage()">
                    <option value="">Semua Jenis</option>
                    <option value="in">Pemasukan</option>
                    <option value="out">Pengeluaran</option>
                    <option value="transfer">Transfer</option>
                </select>
            </div>
            
            <div id="all-transaction-container"></div>
        </div>

        <!-- MODAL TRANSAKSI -->
        <div id="modal-input" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-handle"></div>
                <div class="modal-header"><h3 id="modal-title">Edit Transaksi</h3><button class="btn-close" onclick="window.closeModal('modal-input')"><span class="material-icons-round">close</span></button></div>
                <div id="error-msg" class="error-msg"></div>
                <input type="hidden" id="input-type"><input type="hidden" id="input-trx-id">
                <div class="form-group"><label class="form-label">Pilih Dompet</label><div class="chip-group" id="input-wallet-chips"></div><input type="hidden" id="input-wallet"></div>
                <div class="form-group" id="category-group-container"><label class="form-label">Kategori</label><div class="chip-group" id="input-category-chips"></div><input type="hidden" id="input-category"></div>
                
                <div class="form-group" id="grab-service-group" style="display: none;">
                    <label class="form-label">Layanan Grab (Opsional)</label>
                    <div class="chip-group">
                        <div class="chip grab-chip" onclick="window.selectGrabService('GrabBike', this)">🏍️ GrabBike</div>
                        <div class="chip grab-chip" onclick="window.selectGrabService('GrabBike Hemat', this)">🛵 GrabBike Hemat</div>
                        <div class="chip grab-chip" onclick="window.selectGrabService('GrabCar', this)">🚗 GrabCar</div>
                        <div class="chip grab-chip" onclick="window.selectGrabService('GrabFood', this)">🍔 GrabFood</div>
                        <div class="chip grab-chip" onclick="window.selectGrabService('GrabExpress', this)">📦 GrabExpress</div>
                        <div class="chip grab-chip" onclick="window.selectGrabService('GrabMart', this)">🛒 GrabMart</div>
                    </div>
                    <input type="hidden" id="input-grab-service">
                </div>

                <!-- PERUBAHAN: INPUT LOKASI SEKARANG MEMILIKI DATALIST -->
                <div class="form-group" id="location-group">
                    <label class="form-label">Area / Lokasi (Opsional)</label>
                    <input type="text" id="input-location" class="form-input" placeholder="Misal: Pematangsiantar" list="location-suggestions" autocomplete="off">
                    <datalist id="location-suggestions"></datalist>
                </div>
                
                <div class="form-group" id="target-wallet-group" style="display: none;"><label class="form-label">Dompet Tujuan</label><div class="chip-group" id="input-target-wallet-chips"></div><input type="hidden" id="input-target-wallet"></div>
                
                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <div style="flex: 1;"><label class="form-label">Tanggal</label><input type="date" id="input-date" class="form-input" required></div>
                    <div style="flex: 1;"><label class="form-label">Waktu</label><input type="time" id="input-time" class="form-input" required></div>
                </div>

                <div class="form-group"><label class="form-label">Nominal (Rp)</label><input type="text" inputmode="numeric" pattern="[0-9]*" id="input-amount" class="form-input format-rupiah" placeholder="0" required></div>
                <div class="form-group"><label class="form-label">Keterangan</label><input type="text" id="input-note" class="form-input" placeholder="Misal: Beli Kopi" required></div>
                <button class="btn-submit" onclick="window.simpanTransaksi()">Simpan Perubahan</button>
            </div>
        </div>

        <div id="custom-dialog" class="custom-dialog-overlay"><div class="custom-dialog-box"><h3 class="custom-dialog-title" id="dialog-title">Informasi</h3><p class="custom-dialog-msg" id="dialog-msg"></p><div class="custom-dialog-actions" id="dialog-actions"></div></div></div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav" style="display:flex;">
            <div class="nav-item" onclick="window.location.href='index.html'"><div class="nav-icon-wrapper"><span class="material-icons-round">home</span></div><span>Beranda</span></div>
            <div class="nav-item active"><div class="nav-icon-wrapper"><span class="material-icons-round">history</span></div><span>Riwayat</span></div>
            <div class="nav-item" onclick="window.location.href='analitik.html'"><div class="nav-icon-wrapper"><span class="material-icons-round">bar_chart</span></div><span>Analitik</span></div>
            <div class="nav-item" onclick="window.location.href='index.html?tab=akun'"><div class="nav-icon-wrapper"><span class="material-icons-round">person</span></div><span>Akun</span></div>
        </nav>
    </div>

    <!-- PANGGIL FILE JS SENTRAL -->
    <script type="module" src="app.js"></script>
</body>
</html>
