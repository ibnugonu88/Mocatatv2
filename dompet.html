<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Dompet - MoCatat</title>
    <meta name="theme-color" content="#249a95">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- PANGGIL FILE CSS SENTRAL -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div id="loading-screen" class="loading-screen">Memuat Data...<div class="spinner"></div></div>

        <header class="header-simple">
            <a href="index.html" class="btn-back"><span class="material-icons-round">arrow_back_ios_new</span></a>
            <span>Daftar Dompet & Saldo</span>
        </header>

        <div class="list-wrapper" id="wallet-page-container">
            <!-- List Dompet Akan Muncul Di Sini -->
        </div>
        
        <button class="btn-tambah" onclick="window.openDompetModal()">
            <span class="material-icons-round">add_circle</span> Tambah Dompet Baru
        </button>

        <!-- MODAL TAMBAH/EDIT DOMPET -->
        <div id="modal-dompet" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-handle"></div>
                <div class="modal-header">
                    <h3 id="dompet-modal-title">Tambah Dompet</h3>
                    <button class="btn-close" onclick="window.closeModal('modal-dompet')"><span class="material-icons-round">close</span></button>
                </div>
                <div id="dompet-error-msg" class="error-msg"></div>
                <input type="hidden" id="dompet-id">
                
                <div class="form-group">
                    <label class="form-label">Nama Dompet</label>
                    <input type="text" id="dompet-name" class="form-input" placeholder="Misal: BCA, OVO, Brankas" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Jenis Dompet</label>
                    <div class="segmented-control" id="dompet-type-segment">
                        <div class="segmented-btn active" onclick="window.selectDompetType('cash')">Tunai</div>
                        <div class="segmented-btn" onclick="window.selectDompetType('bank')">Bank</div>
                        <div class="segmented-btn" onclick="window.selectDompetType('ewallet')">E-Wallet</div>
                    </div>
                    <input type="hidden" id="dompet-type" value="cash">
                </div>
                <div class="form-group">
                    <label class="form-label">Saldo Aktual Saat Ini (Rp)</label>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" id="dompet-balance" class="form-input format-rupiah" placeholder="0" required>
                </div>
                <button class="btn-submit" onclick="window.simpanDompet()">Simpan Dompet</button>
            </div>
        </div>

        <div id="custom-dialog" class="custom-dialog-overlay"><div class="custom-dialog-box"><div class="custom-dialog-icon" id="dialog-icon"><span class="material-icons-round">info</span></div><h3 class="custom-dialog-title" id="dialog-title">Informasi</h3><p class="custom-dialog-msg" id="dialog-msg"></p><div class="custom-dialog-actions" id="dialog-actions"></div></div></div>
    </div>

    <!-- PANGGIL FILE JS SENTRAL -->
    <script type="module" src="app.js"></script>
</body>
</html>
